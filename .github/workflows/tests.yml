name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Guardrail eval (detection floor / false-positive ceiling)
        run: python evals/run_eval.py --min-recall 0.9 --max-fpr 0.05
